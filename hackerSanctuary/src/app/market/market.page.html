<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>market</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">market</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-grid>
    <ion-row>
      <ion-col size="12" size-md="6">
        @for (item of items; track item.id) {
        <ion-card class="ion-padding">
          <img alt="Silhouette of mountains" [src]="item.image" width="300" height="300" />
          <ion-card-header>
            <p>{{item.nombre}}</p>
          </ion-card-header>
          <ion-card-content>
            <ion-button [href]="item.url" target="_blank" rel="noopener noreferrer" fill="clear" size="small">
              Buy in amazon
            </ion-button>
          </ion-card-content>
        </ion-card>
        }
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
