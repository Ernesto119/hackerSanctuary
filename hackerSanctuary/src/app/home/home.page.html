<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Home</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">home</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-accordion-group>
    <!-- Laboratorios -->
    <ion-accordion value="labs">
      <ion-item slot="header" color="light">
        <ion-label><h2>Laboratorios</h2></ion-label>
      </ion-item>
      <div slot="content" class="ion-padding">
        <ion-list>
          <ion-item button href="https://tryhackme.com/" target="_blank">
            <ion-label>TryHackMe</ion-label>
          </ion-item>
        </ion-list>
      </div>
    </ion-accordion>

    <!-- Cursos Gratis -->
    <ion-accordion value="courses">
      <ion-item slot="header" color="light">
        <ion-label><h2>Cursos Gratis</h2></ion-label>
      </ion-item>
      <div slot="content" class="ion-padding">
        <ion-list>
          <ion-item
            button
            href="https://www.netacad.com/courses/introduction-to-cybersecurity?courseLang=es-XL"
            target="_blank"
          >
            <ion-label>NetAcad - Intro to Cybersecurity</ion-label>
          </ion-item>

          <ion-item button href="https://portswigger.net/web-security" target="_blank">
            <ion-label>Port swigger academy</ion-label>
          </ion-item>
        </ion-list>
      </div>
    </ion-accordion>

    <!-- Guías -->
    <ion-accordion value="guides">
      <ion-item slot="header" color="light">
        <ion-label><h2>Guías</h2></ion-label>
      </ion-item>
      <div slot="content" class="ion-padding">
        <ion-list>
          <ion-item button href="https://github.com/Pnwcomputers/ULTIMATE-CYBERSECURITY-MASTER-GUIDE" target="_blank">
            <ion-label>Ultimate Cybersecurity Master Guide</ion-label>
          </ion-item>
        </ion-list>
      </div>
    </ion-accordion>

    <!-- Temas -->
    <ion-accordion value="topics">
      <ion-item slot="header" color="light">
        <ion-label><h2>Temas (Forense, Pentesting)</h2></ion-label>
      </ion-item>
      <div slot="content" class="ion-padding">
        <p>Próximamente: Contenido detallado sobre Forense y Red Team.</p>
      </div>
    </ion-accordion>
  </ion-accordion-group>
</ion-content>
